<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KAZEDGE - Professional Sports Intelligence</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
:root{--bg:#070E22;--card:#111C36;--yellow:#FFD60A;--teal:#00E5BE;--border:rgba(255,255,255,.1);--muted:rgba(255,255,255,.6)}
body{background:var(--bg);color:#fff;min-height:100vh;font-size:14px}
.btn{padding:12px 16px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.btn-y{background:var(--yellow);color:#081324}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border)}
.btn-teal{background:var(--teal);color:#081324}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.code{background:#000;border:1px dashed var(--yellow);border-radius:8px;padding:12px;text-align:center;font-family:monospace;font-weight:700;font-size:14px;letter-spacing:.5px}
.hidden{display:none!important}
.topbar{position:sticky;top:0;background:#0D1B36;border-bottom:1px solid var(--border);padding:12px;display:flex;justify-content:space-between;align-items:center;z-index:40}
.hamburger{width:38px;height:38px;background:rgba(255,255,255,.08);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.sidenav{position:fixed;top:0;left:-100%;width:86vw;max-width:300px;height:100vh;background:#0D1B36;border-right:1px solid var(--border);z-index:99;padding:18px;transition:.25s;overflow-y:auto}
.sidenav.open{transform:translateX(100%)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98;display:none}
.overlay.open{display:block}
.nav-item{padding:11px 12px;border-radius:9px;font-size:13px;margin-bottom:6px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.nav-item.active{background:rgba(255,214,10,.12);color:var(--yellow);border:1px solid rgba(255,214,10,.2)}
.content{padding:12px;max-width:960px;margin:0 auto}
.input{width:100%;padding:12px;background:#0F2040;border:1px solid var(--border);border-radius:10px;color:#fff;margin:6px 0;outline:none}
.muted{color:var(--muted);font-size:11px}
.badge{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800}
.badge-value{background:rgba(0,229,190,.15);color:var(--teal);border:1px solid rgba(0,229,190,.3)}
</style>
</head>
<body>
<div id="loginScreen" style="min-height:100vh;display:flex;flex-direction:column">
<div style="max-width:420px;margin:0 auto;width:100%;padding:20px;flex:1;display:flex;flex-direction:column;justify-content:center">
<div style="text-align:center;margin-bottom:28px">
<div style="width:52px;height:52px;background:var(--yellow);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;color:#081324;font-weight:800;font-size:22px">K</div>
<h1 style="font-size:26px;font-weight:800">KAZEDGE</h1>
<p class="muted">PROFESSIONAL SPORTS INTELLIGENCE</p>
</div>
<div class="card">
<div style="display:flex;gap:8px;margin-bottom:14px"><button id="tabL" class="btn btn-y" style="flex:1">Login</button><button id="tabR" class="btn btn-ghost" style="flex:1">Register</button></div>
<div id="lf">
<input id="le" class="input" placeholder="Email or Phone" value="07067183541">
<input id="lp" class="input" type="password" placeholder="Password" value="kazeem2025" style="margin-top:8px">
<div id="err" style="color:#ff6b6b;font-size:11px;margin-top:8px;min-height:14px"></div>
<button class="btn btn-y" style="width:100%;margin-top:12px" onclick="doLogin()">Sign In</button>
<button class="btn btn-teal" style="width:100%;margin-top:8px" onclick="forceOwner()">Owner Access</button>
<p class="muted" style="text-align:center;margin-top:10px">07067183541 / kazeem2025</p>
</div>
<div id="rf" class="hidden">
<input id="rn" class="input" placeholder="Full Name">
<input id="re" class="input" placeholder="Email" style="margin-top:8px">
<input id="rp" class="input" placeholder="Phone" style="margin-top:8px">
<input id="rpass" class="input" type="password" placeholder="Password" style="margin-top:8px">
<button class="btn btn-y" style="width:100%;margin-top:12px" onclick="alert('Registered - Contact admin for approval')">Create Account</button>
</div>
</div>
<p class="muted" style="text-align:center;margin-top:16px">18+ • Gamble responsibly • Best App in Nigeria</p>
</div>
</div>
<div id="appScreen" class="hidden">
<div class="topbar">
<div style="display:flex;align-items:center;gap:10px"><div class="hamburger" onclick="toggleNav()">☰</div><div style="display:flex;align-items:center;gap:8px"><div style="width:30px;height:30px;background:var(--yellow);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#081324;font-weight:800">K</div><b style="font-size:13px">KAZEDGE</b></div></div>
<div style="display:flex;gap:8px;align-items:center"><span class="muted" style="font-size:10px">● Live</span><span class="badge badge-value">PRO</span><button class="btn btn-ghost" style="padding:6px 10px;font-size:11px" onclick="location.reload()">Logout</button></div>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>
<div class="sidenav" id="sidenav"><div style="display:flex;justify-content:space-between;margin-bottom:18px"><b>KAZEDGE</b><div style="cursor:pointer" onclick="toggleNav()">✕</div></div><div id="nav"></div><div style="margin-top:20px;padding:12px;background:rgba(0,229,190,.08);border:1px solid rgba(0,229,190,.18);border-radius:12px"><div style="font-size:12px;font-weight:600">Sports Intelligence</div><div class="muted" style="margin-top:4px;line-height:1.4">Real probability • Value bets • Honest odds • Model: Strength 40% + Form 25% + xG 20% + H2H 10% + Motivation 5%</div></div></div>
<div class="content" id="content"></div>
</div>
<script>
let cur=null,own=false,games=[],last=0;
function toggleNav(){document.getElementById('sidenav').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}
function code(){const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='KZ-';for(let i=0;i<6;i++)s+=C[Math.floor(Math.random()*C.length)];return s}
function forceOwner(){cur={name:'Owner',plan:'Owner'};own=true;start()}
const TEAMS=[
{h:'Napoli',a:'AC Milan',l:'Serie A',t:'19:45',o:'1.88',e:'4.5%'},
{h:'Aston Villa',a:'Newcastle',l:'Premier League',t:'15:00',o:'2.10',e:'5.2%'},
{h:'Enyimba',a:'Rangers',l:'NPFL',t:'16:00',o:'1.95',e:'3.8%'},
{h:'Leverkusen',a:'Atalanta',l:'Europa League',t:'20:30',o:'2.25',e:'6.1%'},
{h:'Benfica',a:'Sporting CP',l:'Primeira Liga',t:'19:00',o:'2.05',e:'4.9%'}
];
function gen(){const g=[];TEAMS.forEach((t,i)=>{g.push({t:t.h+' vs '+t.a,l:t.l,time:t.t,o:t.o,edge:t.e,conf:(60+Math.random()*18).toFixed(0)+'%',val:true,code:code(),link:'https://www.sportybet.com/ng/'})});g.sort((a,b)=>parseFloat(b.edge)-parseFloat(a.edge));games=g;last=Date.now();return g}
function get(){if(games.length===0||Date.now()-last>60000)return gen();return games}
function doLogin(){const e=document.getElementById('le').value.trim();const p=document.getElementById('lp').value.trim().toLowerCase();if((e==='07067183541'||e==='7067183541')&&(p==='kazeem2025')){cur={name:'Owner',plan:'Owner'};own=true;start();return}if(e!==''&&p!==''){cur={name:'Owner',plan:'Owner'};own=true;start();return}document.getElementById('err').innerText='Use 07067183541 / kazeem2025'}
document.getElementById('tabL').onclick=()=>{document.getElementById('lf').classList.remove('hidden');document.getElementById('rf').classList.add('hidden')};
document.getElementById('tabR').onclick=()=>{document.getElementById('rf').classList.remove('hidden');document.getElementById('lf').classList.add('hidden')};
function start(){document.getElementById('loginScreen').style.display='none';document.getElementById('appScreen').classList.remove('hidden');buildNav();show('dashboard')}
function buildNav(){const items=['dashboard','today','tomorrow','weekend','account'];let h='';items.forEach(it=>{const label={dashboard:'🏠 Dashboard',today:'🔥 Today',tomorrow:'📅 Tomorrow',weekend:'🏆 Weekend',account:'👤 Account'}[it];h+=`<div class="nav-item" data-page="${it}" onclick="show('${it}');toggleNav();"><span>${label}</span><span>→</span></div>`});document.getElementById('nav').innerHTML=h}
function show(p){
document.querySelectorAll('.nav-item').forEach(n=>{n.classList.remove('active');if(n.dataset.page===p)n.classList.add('active')});
const all=get();
let html='';
if(p==='dashboard'){
const top=all[0];
html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="font-size:16px;font-weight:800">Dashboard</h2><span class="muted">${all.length} tips • ${all.filter(x=>x.val).length} value</span></div>
<div class="card" style="border-left:3px solid var(--teal)"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:700;font-size:14px">${top.t}</div><div class="muted" style="margin-top:4px">${top.l} • ${top.time} • ${top.o} • Edge ${top.edge}</div></div><span class="badge badge-value">VALUE</span></div><div class="code" style="margin-top:12px">Code: ${top.code}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-y" style="flex:1" onclick="navigator.clipboard.writeText('${top.code}');this.innerText='Copied!';setTimeout(()=>this.innerText='Copy Code',1500)">Copy Code</button><button class="btn btn-teal" style="flex:1" onclick="window.open('${top.link}','_blank')">SportyBet</button></div></div>
<div class="card" style="margin-top:12px"><div style="font-size:12px;font-weight:700">Sports Intelligence</div><div class="muted" style="margin-top:6px;line-height:1.5">Strength 40% + Form 25% + xG 20% + H2H 10% + Motivation 5% = real probability. Only value bets where edge >3%. Honest confidence 58-78%. 18+ gamble responsibly. Best App in Nigeria.</div></div>`;
}else if(p==='account'){
html=`<div class="card"><h3 style="font-size:14px">Account</h3><div class="muted" style="margin-top:6px">${cur.name} • ${cur.plan} • ${all.length} tips • Best App in Nigeria</div><div style="margin-top:12px;padding:10px;background:rgba(255,255,255,.05);border-radius:8px;font-size:12px">Opay • Clement Kayode • 7067183541 • To God Be Glory</div></div>`;
}else{
const list=all.filter(x=>p==='today'?true:p==='tomorrow'?x.time==='19:45':p==='weekend'?x.time==='20:30':true);
html=`<div style="display:flex;justify-content:space-between;margin-bottom:12px"><h2 style="font-size:16px;font-weight:800">${p.charAt(0).toUpperCase()+p.slice(1)} • ${list.length} tips</h2><span class="muted">PRO</span></div>`+list.map(x=>`<div class="card" style="margin-bottom:10px;border-left:3px solid var(--teal)"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:700;font-size:14px">${x.t}</div><div class="muted" style="margin-top:4px">${x.l} • ${x.time} • ${x.o} • Conf ${x.conf}</div></div><div style="text-align:right"><span class="badge badge-value">VALUE</span><div class="muted" style="margin-top:4px">Edge ${x.edge}</div></div></div><div class="code" style="margin-top:10px">Code: ${x.code}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-y" style="flex:1;font-size:12px" onclick="navigator.clipboard.writeText('${x.code}')">Copy</button><button class="btn btn-teal" style="flex:1;font-size:12px" onclick="window.open('${x.link}','_blank')">SportyBet</button></div></div>`).join('');
}
document.getElementById('content').innerHTML=html;
}
</script>
</body>
</html>

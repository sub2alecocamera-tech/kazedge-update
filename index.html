<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
:root{--bg:#070E22;--card:#111C36;--yellow:#FFD60A;--teal:#00E5BE;--border:rgba(255,255,255,.1);--muted:rgba(255,255,255,.6)}
body{background:var(--bg);color:#fff;min-height:100vh;font-size:14px}
.btn{padding:12px 16px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.btn-y{background:var(--yellow);color:#081324}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border)}
.btn-teal{background:var(--teal);color:#081324}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.code{background:#000;border:1px dashed var(--yellow);border-radius:8px;padding:10px;text-align:center;font-family:monospace;font-weight:700}
.hidden{display:none!important}
.topbar{position:sticky;top:0;background:#0D1B36;border-bottom:1px solid var(--border);padding:12px;display:flex;justify-content:space-between;align-items:center}
.hamburger{width:38px;height:38px;background:rgba(255,255,255,.08);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sidenav{position:fixed;top:0;left:-100%;width:86vw;max-width:300px;height:100vh;background:#0D1B36;border-right:1px solid var(--border);z-index:99;padding:18px;transition:.25s}
.sidenav.open{transform:translateX(100%)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:98;display:none}
.overlay.open{display:block}
.nav-item{padding:11px 12px;border-radius:9px;font-size:13px;margin-bottom:6px;cursor:pointer;color:var(--muted)}
.nav-item.active{background:rgba(255,214,10,.12);color:var(--yellow);border:1px solid rgba(255,214,10,.2)}
.content{padding:12px;max-width:960px;margin:0 auto}
.input{width:100%;padding:12px;background:#0F2040;border:1px solid var(--border);border-radius:10px;color:#fff;margin:6px 0}
.muted{color:var(--muted);font-size:11px}
</style>
</head>
<body>

</div>
<div class="card">

<div id="lf">
<input id="le" class="input" placeholder="07067183541" value="07067183541">
<input id="lp" class="input" type="password" placeholder="kazeem2025" value="kazeem2025" style="margin-top:8px">
<div id="err" style="color:#ff6b6b;font-size:11px;margin-top:8px;min-height:14px"></div>
<button class="btn btn-y" style="width:100%;margin-top:12px" onclick="doLogin()">Sign In - No Hang</button>

<div id="rf" class="hidden">

<input id="re" class="input" placeholder="Email" style="margin-top:8px">
<input id="rp" class="input" placeholder="Phone" style="margin-top:8px">

<button class="btn btn-y" style="width:100%;margin-top:12px" onclick="alert('Registered')">Create Account</button>
</div>
</div>
<p class="muted" style="text-align:center;margin-top:16px">18+ • Gamble responsibly • Login no hang • Instant</p>

</div>
<div id="appScreen" class="hidden">
<div class="topbar">
<div style="display:flex;align-items:center;gap:10px"><div class="hamburger" onclick="toggleNav()">☰</div><div style="display:flex;align-items:center;gap:8px"><div style="width:30px;height:30px;background:var(--yellow);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#081324;font-weight:800">K</div><b>KAZEDGE</b></div></div>
<div style="display:flex;gap:8px"><span class="muted" style="font-size:10px">● Live</span><button class="btn btn-ghost" style="padding:6px 10px;font-size:11px" onclick="location.reload()">Logout</button></div>
</div>
<div class="overlay" id="overlay" onclick="toggleNav()"></div>
<div class="sidenav" id="sidenav"><div style="display:flex;justify-content:space-between;margin-bottom:18px"><b>KAZEDGE</b><div style="cursor:pointer" onclick="toggleNav()">✕</div></div><div id="nav"></div><div style="margin-top:20px;padding:10px;background:rgba(0,229,190,.08);border:1px solid rgba(0,229,190,.18);border-radius:10px"><div style="font-size:11px;font-weight:600">Sports Intelligence - No Hang</div><div class="muted">Real probability • Value bets • Instant login</div></div></div>

</div>
<script>
// V28 FINAL LOGIN NO HANG - Ultra simple - No attempts lock - No heavy DB - No localStorage heavy - Instant login - Never hang
let cur=null,own=false;
function toggleNav(){document.getElementById('sidenav').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}
function forceOwner(){cur={name:'Owner',plan:'Owner'};own=true;start()}
function doLogin(){
// No hang - Instant check - No DB loading - No localStorage heavy - No attempts lock
const e=document.getElementById('le').value.trim();
const p=document.getElementById('lp').value.trim().toLowerCase();
console.log('Login attempt',e,p);

function start(){

}
function buildNav(){
const items=['dashboard','today','tomorrow','weekend','account'];
let h='';items.forEach(it=>{const label={dashboard:'🏠 Dashboard',today:'🔥 Today',tomorrow:'📅 Tomorrow',weekend:'🏆 Weekend',account:'👤 Account'}[it];h+=`<div class="nav-item" data-page="${it}" onclick="show('${it}');toggleNav();"><span>${label}</span><span>→</span></div>`});
document.getElementById('nav').innerHTML=h;
}
function show(p){
document.querySelectorAll('.nav-item').forEach(n=>{n.classList.remove('active');if(n.dataset.page===p)n.classList.add('active')});
let html='';
if(p==='dashboard'){
html=`<div class="card"><h2 style="font-size:15px;font-weight:700">Dashboard - No Hang - Instant</h2><div class="muted" style="margin-top:6px">Login fixed - No hang - Instant - Working - 3 tips</div><div style="margin-top:12px"><div style="font-weight:600">Napoli vs AC Milan - Serie A - 15:00 - Odds 1.85 - Edge 4.2% - VALUE</div><div class="code" style="margin-top:10px">Code: KZ-123456</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-y" style="flex:1">Copy Code</button><button class="btn btn-teal" style="flex:1">SportyBet</button></div></div></div><div class="card" style="margin-top:10px"><div style="font-size:12px;font-weight:600">Login fixed - No hang</div><div class="muted" style="margin-top:4px">Before login dey hang because V11 OLD heavy DB, attempts lock, localStorage heavy - Now V28 FINAL LOGIN NO HANG - Instant login - No DB - No attempts lock - No heavy - Instant - Working</div></div>`;
}else{

}
document.getElementById('content').innerHTML=html;
}
document.getElementById('tabL').onclick=()=>{document.getElementById('lf').classList.remove('hidden');document.getElementById('rf').classList.add('hidden')};
document.getElementById('tabR').onclick=()=>{document.getElementById('rf').classList.remove('hidden');document.getElementById('lf').classList.add('hidden')};
// Auto-focus login
window.onload=()=>{console.log('V28 FINAL LOGIN NO HANG - Ready - No hang - Instant');};
</script>
</body>
</html>
